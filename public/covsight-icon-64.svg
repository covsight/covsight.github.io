<!--
  covsight icon 64×64 — based on v2b, no wordmark
  Chip body: x=12 y=8 w=40 h=30 — 3 pins/side — 4 bars
  Bars: h=3, pitch=5, y: 14,19,24,29  track x: 16–50 (w=34)
  Fills: green 90%=31px  amber 72%=24px  green 85%=29px  red 42%=14px
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="cc64">
      <rect x="13" y="9" width="38" height="28" rx="2"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="9" fill="#0a192f"/>

  <!-- Chip body -->
  <rect x="12" y="8" width="40" height="30" rx="2.5"
        fill="#0d2240" stroke="#4a8aaa" stroke-width="1.5"/>

  <!-- Pin-1 dot -->
  <circle cx="15" cy="11" r="1" fill="#4a8aaa" opacity="0.7"/>

  <!-- Pins — top -->
  <line x1="21" y1="8"  x2="21" y2="4.5" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="8"  x2="32" y2="4.5" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="8"  x2="43" y2="4.5" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bottom -->
  <line x1="21" y1="38" x2="21" y2="41.5" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="41.5" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="38" x2="43" y2="41.5" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- left -->
  <line x1="12" y1="14" x2="8.5" y2="14" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="23" x2="8.5" y2="23" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="8.5" y2="32" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- right -->
  <line x1="52" y1="14" x2="55.5" y2="14" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="23" x2="55.5" y2="23" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="55.5" y2="32" stroke="#4a8aaa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 100% ref line -->
  <line x1="50" y1="12" x2="50" y2="34"
        stroke="#d8ecf6" stroke-width="0.5" opacity="0.2" clip-path="url(#cc64)"/>

  <!-- Bar 1 — 90% green -->
  <rect x="16" y="14" width="34" height="3" rx="1.5" fill="#0a2a40" clip-path="url(#cc64)"/>
  <rect x="16" y="14" width="31" height="3" rx="1.5" fill="#22c55e" clip-path="url(#cc64)"/>

  <!-- Bar 2 — 72% amber -->
  <rect x="16" y="19" width="34" height="3" rx="1.5" fill="#0a2a40" clip-path="url(#cc64)"/>
  <rect x="16" y="19" width="24" height="3" rx="1.5" fill="#f59e0b" clip-path="url(#cc64)"/>

  <!-- Bar 3 — 85% green -->
  <rect x="16" y="24" width="34" height="3" rx="1.5" fill="#0a2a40" clip-path="url(#cc64)"/>
  <rect x="16" y="24" width="29" height="3" rx="1.5" fill="#22c55e" clip-path="url(#cc64)"/>

  <!-- Bar 4 — 42% red -->
  <rect x="16" y="29" width="34" height="3" rx="1.5" fill="#0a2a40" clip-path="url(#cc64)"/>
  <rect x="16" y="29" width="14" height="3" rx="1.5" fill="#ef4444" clip-path="url(#cc64)"/>

  <!-- Wordmark -->
  <text x="32" y="56"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="9" text-anchor="middle" dominant-baseline="auto">
    <tspan font-weight="700" fill="#00c8a8">cov</tspan><tspan fill="#d8ecf6">sight</tspan>
  </text>
</svg>
