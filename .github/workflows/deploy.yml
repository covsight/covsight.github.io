name: Build site

# BUILD ONLY. This workflow does not publish anything, by design.
#
# This repo is the source of the covsight ORG LANDING PAGE, which is published
# by FORGEJO to dvkit.org/covsight/ -- not by GitHub Pages to
# covsight.github.io. See ~/Documents/dvkit-docs-publishing-design.md 5.9:
# dvkit.org owns all documentation, and both kinds of Pages content live there.
# An <org>.github.io repo lands at dvkit.org/<org>/; an ordinary repo's docs
# land at dvkit.org/<org>/<repo>/.
#
# dvkit.org is a single Cloudflare Pages project and a deploy replaces the
# WHOLE site, so there is exactly one publisher for it: the host-side poller,
# which reads build artifacts from the Forgejo API with a Cloudflare token that
# never enters a job container. A GitHub Pages site here would be a second
# publisher of the same content on a different schedule, which is what drifts.
#
# This job stays because a site build that breaks should still fail a push.
#
# History, because the intermediate state looks like a finished one: the deploy
# job was first converted from branch-driven to tag-driven, so that the first
# mirrored push could not republish the site as a side effect of a sync
# (sync-policy.toml, [release] trigger = "tag"). That was a migration step, not
# the destination -- a tag-gated deploy is still a second publisher. Both steps
# were required, in that order.
#
# The repo itself stays as the SOURCE of the landing page; Forgejo remains its
# origin of truth. What it stops doing is serving. Once dvkit.org/covsight/
# verifies, covsight.github.io becomes a redirect stub pointing at it (5.8).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
